<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoutLink</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link rel="stylesheet" href="pagina-index.css">
</head>

<body>


  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">

    <a class="navbar-brand" href="#">
      <img src="/img/ScoutLink-Logo.png" class="logo-navbar " alt="Logo do ScoutLink">
    </a>


    <ul class="navbar-nav ms-auto d-flex flex-row gap-3">
      <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
      <li class="nav-item"><a class="nav-link" href="/paginas/Talento/talento.html">Talento</a></li>
      <li class="nav-item"><a class="nav-link" href="/paginas/Organizacoes/organizacoes.html">Organizações</a></li>
      <li class="nav-item"><a class="nav-link" href="/paginas/Sobre/sobre.html">Sobre</a></li>
    </ul>

    <button onclick="irEntrar()" class="btn_perfil btn-danger ms-3">Login</button>
  </nav>




  <div class="text-center mt-5">
    <p class="frase">
      Conectando jogadores ao cenário profissional de eSports.
      <br>

      <button onclick="irCadastrar()" class="btn_perfil btn-danger ms-3">Cadastrar</button>
    </p>

  </div>


  <div class="banner text-center">
    <h1>Vire um profissional</h1>
  </div>


  <div class="container mt-5">
    <div class="row align-items-center">


      <div class="col-12 col-md-4">
        <div class="perfil-card">

          <div class="foto"><img src="/img/foto verde.jpeg" alt="Jogador Gui" class="img-fluid"></div>

          <div class="caixa_info text-center">
            <h4>GUILHERME</h4>
            
            <img src="/img/image copy 2.png" alt="Logo Valorant" class="img-fluid w-25 mb-2"><br>
            <button onclick="irJogador()" class="btn btn-outline-danger btn-sm">Ver Mais</button> 


          </div>

        </div>
      </div>

      <div class="perfil-card col-12 col-md-8 text-center">
        <video class="img-fluid" controls>
          <source src="/video/video tela inicial.mp4" type="video/mp4">
          Seu navegador não suporta vídeo.
        </video>
      </div>

    </div>
  </div>


  <div class="container text-center mt-5">

    <h4 class="titulo">
      ORGANIZAÇÕES COM MAIS CONTRATOS
    </h4>

    <div class="row mt-4">

      <div class="col-12 col-md-4">
        <div class="org-card">
          <div class="org-img"><img src="/img/furia.png" alt="Logo FURIA" class="img-fluid"> </div>
          <button onclick="irFuria()" class="btn_org btn-danger ms-3">Furia</button>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="org-card">
          <div class="org-img"><img src="/img/sem fundo mibr.png" alt="Logo MIBR" class="img-fluid"></div>
          <button onclick="irMibr()" class="btn_org btn-danger ms-3">Mibr</button>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="org-card">
          <div class="org-img"><img src="/img/sem fundo loud.png" alt="Logo LOUD" class="img-fluid"></div>
          <button onclick="irLoud()" class="btn_org btn-danger ms-3">Loud</button>
        </div>
      </div>

    </div>
  </div>


  <footer class="rodape mt-5">
    <p>© 2026 ScoutLink | Criado por Guilherme, Maria, Leonardo e Vinicius</p>
  </footer>

  <script src="/js/funcoes.js"></script>

</html>

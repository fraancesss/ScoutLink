<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoutLink - Sucesso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box-sucesso {
      background-color: #262626;
      border: 2px solid #8c1111;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      max-width: 500px;
      width: 100%;
    }
    .icone-check {
      font-size: 4rem;
      color: #28a745;
      margin-bottom: 20px;
    }
    .btn-voltar {
      background-color: #8c1111;
      color: white;
      border: none;
      padding: 12px 30px;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
      transition: 0.3s;
      margin-top: 20px;
    }
    .btn-voltar:hover {
      background-color: #ff1a1a;
      color: black;
    }
  </style>
</head>
<body>

  <div class="box-sucesso text-center">
    <div class="icone-check">✅</div>
    <h1 class="h3 mb-3">Formulário enviado com sucesso!</h1>
    <p class="text-muted">Seu portfólio foi encaminhado para a organização selecionada. Boa sorte no recrutamento!</p>
    
    <a href="organizacao.html" class="btn-voltar">Voltar para Organizações</a>
  </div>

</body>
</html>

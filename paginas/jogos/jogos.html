<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoutLink - Jogos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../jogos/estilo-jogos.css">
  <link rel="stylesheet" href="../../css/navbar.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">

    <a class="navbar-brand" href="../../index.html">
      <img src="../../img/ScoutLink-Logo.png"
           class="logo-navbar"
           alt="ScoutLink">
    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuNavbar">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link " href="../../index.html">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Talento/talento.html">Talento</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Organizacao/organizacao.html">Organizações</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="../jogos/jogos.html">Jogo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Sobre/sobre.html">Sobre</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../mapa/mapa.html">Mapa do Site</a>
        </li>
      </ul>

      <button class="btn_perfil ms-lg-3 mt-3 mt-lg-0"
              onclick="window.location.href='../Login/login.html'">
        Login
      </button>
    </div>

  </div>
</nav>

  <div class="container mt-5">
    
    <div class="row justify-content-center mb-4">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-secondary text-white">🔎</span>
          <input type="text" id="campo-busca" class="form-control" placeholder="Buscas Jogo..." oninput="filtrarJogos()">
        </div>
      </div>
    </div>

    <div class="row justify-content-center text-center mb-5">
      <div class="col-12">
        <div class="btn-group flex-wrap" role="group">
          <button type="button" class="btn btn-outline-danger active" onclick="filtrarPorCategoria('todos', this)">Todos</button>
          <button type="button" class="btn btn-outline-danger" onclick="filtrarPorCategoria('fps', this)">FPS</button>
          <button type="button" class="btn btn-outline-danger" onclick="filtrarPorCategoria('battle-royale', this)">Battle Royale</button>
          <button type="button" class="btn btn-outline-danger" onclick="filtrarPorCategoria('moba', this)">MOBA</button>
          <button type="button" class="btn btn-outline-danger" onclick="filtrarPorCategoria('esportes', this)">Esportes</button>
          <button type="button" class="btn btn-outline-danger" onclick="filtrarPorCategoria('hero-shooter', this)">Hero Shooter</button>
        </div>
      </div>
    </div>

    <div class="bg-grid-jogos p-4 rounded">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="container-jogos">
       
      </div>
    </div>

  </div>

  <script src="../../js/jogos-dados.js"></script>
</body>
</html>

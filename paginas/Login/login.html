<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoutLink - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Login/estilo-login.css">
  <link rel="stylesheet" href="../../css/navbar.css">
</head>

<body>

<video autoplay muted loop id="bg-video">
  <source src="../../video/Particles_47___45s___4k_res.mp4" type="video/mp4">
</video>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">

    <a class="navbar-brand" href="../../index.html">
      <img src="../../img/ScoutLink-Logo.png"
           class="logo-navbar"
           alt="ScoutLink">
    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuNavbar">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="../../index.html">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Talento/talento.html">Talento</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Organizacao/organizacao.html">Organizações</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Jogos/jogos.html">Jogos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../Sobre/sobre.html">Sobre</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="../mapa/mapa.html">Mapa do Site</a>
        </li>
      </ul>

      <button class="btn_perfil ms-lg-3 mt-3 mt-lg-0"
              onclick="window.location.href='../Cadastro/cadastro.html'">
        Cadastrar
      </button>
    </div>

  </div>
</nav>


<div class="container d-flex justify-content-center align-items-center min-vh-100">

  <div class="form-cadastro text-center">

    <h3 class="mb-4">Entrar em uma Conta</h3>

    <div class="mb-3 text-start">
      <input type="email" id="email" placeholder="Email" class="form-control">
      <div class="invalid-feedback">
        Por favor, informe seu e-mail.
      </div>
    </div>

    <div class="mb-3 text-start">
      <input type="password" id="senha" placeholder="Senha" class="form-control">
      <div class="invalid-feedback">
        Por favor, informe sua senha.
      </div>
    </div>

    <button type="button" onclick="validarLogin()" class="btn btn-dark w-100">
      Entrar
    </button>

    <div id="mensagem-sucesso" class="alert alert-success mt-3 d-none">
      Login realizado com sucesso!
    </div>

  </div>

</div>


<footer class="rodape">
  <p>© 2026 ScoutLink | Guilherme, Isabelle, Leonardo, Maria e Vinicius</p>
</footer>

<script src="../../js/login.js"></script>

</body>
</html>

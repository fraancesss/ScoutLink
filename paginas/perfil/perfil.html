            data-bs-target="#menuNavbar">
      <span class="navbar-toggler-icon"></span>

    <div class="collapse navbar-collapse" id="menuNavbar">

      <ul class="navbar-nav ms-auto">

<div class="container py-5">

  <div class="row g-4">

    <!-- PERFIL -->
    <div class="col-lg-3">

      <div class="card bg-dark text-white text-center p-4">

        <img
          id="foto-perfil"
          src="../../img/perfil-padrao.png"
          class="rounded-circle mx-auto mb-3"
          width="120"
          height="120"
          alt="Perfil">

        <h4 id="nome-usuario">Usuário</h4>

        <p id="email-usuario" class="text-secondary">
          email@exemplo.com
        </p>

        <p id="telefone-usuario" class="text-secondary">
          (00) 00000-0000
        </p>

      </div>

    </div>

    <!-- CONTEÚDO -->
    <div class="col-lg-9">

      <!-- SOBRE -->
      <div class="card bg-dark text-white p-4 mb-4">

        <h2>Informações Sobre</h2>

        <textarea
          id="descricao"
          class="form-control my-3"
          rows="4"
          placeholder="Fale sobre você, sua experiência e objetivos..."></textarea>

        <button
          class="btn btn-primary"
          onclick="salvarDescricao()">
          Salvar Informações
        </button>

      </div>

      <div class="row g-4">

        <!-- CAMPEONATOS -->
        <div class="col-md-6">

          <div class="card bg-dark text-white p-4 h-100">

            <h2>Campeonatos</h2>

            <div class="input-group mb-3">

              <input
                type="text"
                id="novo-campeonato"
                class="form-control"
                placeholder="Ex: Masters Shanghai 2025">

              <button
                class="btn btn-outline-light"
                onclick="adicionarCampeonato()">
                +
              </button>

            </div>

            <ul
              id="lista-campeonatos"
              class="list-group list-group-flush">
            </ul>

          </div>

        </div>

        <!-- JOGOS -->
        <div class="col-md-6">

          <div class="card bg-dark text-white p-4 h-100">

            <h2>Jogos com Especialidade</h2>

            <div class="input-group mb-3">

              <select
                id="novo-jogo"
                class="form-select">

                <option>Valorant</option>
                <option>Counter Strike 2</option>
                <option>Fortnite</option>
                <option>League of Legends</option>
                <option>Rainbow Six Siege</option>
                <option>Rocket League</option>

              </select>

              <button
                class="btn btn-outline-light"
                onclick="adicionarJogo()">
                +
              </button>

            </div>

            <ul
              id="lista-jogos"
              class="list-group list-group-flush">
            </ul>

          </div>

        </div>

      </div>

      <!-- RANKING -->
      <div class="card bg-dark text-white p-4 mt-4">

        <h2>Ranking do Jogador</h2>

        <input
          type="number"
          id="vitorias"
          class="form-control mb-2"
          placeholder="Quantidade de vitórias">

        <input
          type="number"
          id="campeonatos-ganhos"
          class="form-control mb-3"
          placeholder="Campeonatos ganhos">

        <button
          class="btn btn-success"
          onclick="calcularRanking()">
          Calcular Ranking
        </button>

        <p
          id="resultado-ranking"
          class="mt-3 fw-bold">
        </p>

      </div>

    </div>

  </div>

</div>

<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScoutLink - Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Perfil/estilo-perfil.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="../Talento/talento.html">Talento</a></li>
          <li class="nav-item"><a class="nav-link active" href="../Organizacao/organizacao.html">Organizações</a></li>
          <li class="nav-item"><a class="nav-link" href="../jogos/jogos.html">Jogos</a></li>
          <li class="nav-item"><a class="nav-link" href="../Sobre/sobre.html">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="../mapa/mapa.html">Mapa do Site</a></li>
        </ul>
        <button onclick="logout()" class="btn btn-danger ms-lg-2">Sair</button>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">
      
      <div class="col-lg-3 text-center mb-4">
        <div class="border p-3 rounded bg-dark text-white">
          <div class="mb-3 mx-auto rounded-circle bg-secondary d-flex align-items-center justify-content-center" style="width: 120px; height: 120px;">
            <span class="fw-bold">FOTO</span>
          </div>
          <h4 id="nome-usuario" class="mb-2">Guilherme</h4>
          <p id="email-usuario" class="text-muted mb-1">email@exemplo.com</p>
          <p id="telefone-usuario" class="text-muted">(00) 00000-0000</p>
        </div>
      </div>

      <div class="col-lg-9">

        <div class="card p-4 mb-4 bg-dark text-white">
          <h2>Informações Sobre</h2>
          <textarea id="descricao" class="form-control my-3" rows="3" placeholder="Fale sobre você, sua experiência e objetivos..."></textarea>
          <button class="btn btn-primary" onclick="salvarDescricao()">Salvar Informações</button>
        </div>

        <div class="row g-4">
          <div class="col-md-6">
            <div class="card p-4 h-100 bg-dark text-white">
              <h2>Campeonatos</h2>
              <div class="input-group mb-3">
                <input type="text" id="novo-campeonato" class="form-control" placeholder="Ex: Masters Shanghai 2025">
                <button class="btn btn-outline-light" onclick="adicionarCampeonato()">+</button>
              </div>
              <ul id="lista-campeonatos" class="list-group list-group-flush">
                </ul>
            </div>
          </div>

          <div class="col-md-6">
            <div class="card p-4 h-100 bg-dark text-white">
              <h2>Jogos com Especialidade</h2>
              <div class="input-group mb-3">
                <select id="novo-jogo" class="form-select">
                  <option>Valorant</option>
                  <option>Fortnite</option>
                  <option>CS2</option>
                  <option>League of Legends</option>
                </select>
                <button class="btn btn-outline-light" onclick="adicionarJogo()">+</button>
              </div>
              <ul id="lista-jogos" class="list-group list-group-flush">
                </ul>
            </div>
          </div>
        </div>

      </div> </div> </div> <footer class="text-center py-4 mt-5 bg-dark text-white">
    <p>© 2026 ScoutLink | Guilherme, Isabelle, Leonardo, Maria e Vinicius</p>
  </footer>

  <script src="../../js/perfil.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
